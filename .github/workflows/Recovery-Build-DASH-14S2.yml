name: DASH Native OrangeFox 14.1 Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      MANIFEST_BRANCH: "14.1"
      DEVICE_NAME: "dash"
      DEVICE_PATH: "device/xiaomi/dash"
      LUNCH_TARGET: "twrp_dash-ap2a-eng"

      DEVICE_TREE_URL: "https://github.com/rakarizaldy-id/orangefox-dash.git"
      DEVICE_TREE_COMMIT: "c17bb1f20481d1fd3c8cc37f29ac0879cb63458f"

      KERNEL_REPO: "https://github.com/xiaomi-dash/android_device_xiaomi_dash-kernel.git"
      KERNEL_COMMIT: "c3d766d2d99e6344649f9eeca52d405d48ca75dc"

      MTK_HW_REPO: "https://github.com/rakarizaldy-id/orangefox-dash-mtk-hardware.git"
      MTK_HW_COMMIT: "1f3d4ad839820aacf10eae2c5c8952dad595319c"

      MTK_SEPOLICY_REPO: "https://github.com/rakarizaldy-id/orangefox-dash-mtk-sepolicy.git"
      MTK_SEPOLICY_COMMIT: "e73769c76d0920864a9f15284ab05359187fc691"

      LINEAGE_SEPOLICY_REPO: "https://github.com/LineageOS/android_device_lineage_sepolicy.git"
      LINEAGE_SEPOLICY_COMMIT: "70d97946d5541fb42db89eb84ccfd62b5b9e4fde"

      GOOGLE_INTERFACES_REPO: "https://android.googlesource.com/platform/hardware/google/interfaces"
      GOOGLE_INTERFACES_COMMIT: "4f5492b37b6091730b213e52a1632f2658468925"

      GOOGLE_PIXEL_REPO: "https://android.googlesource.com/platform/hardware/google/pixel"
      GOOGLE_PIXEL_COMMIT: "f2e22cee311d343d9d7289361ab369e545ec22bf"

      GUAVA_REPO: "https://android.googlesource.com/platform/external/guava"
      GUAVA_COMMIT: "95a504e10064d1cfa0ee5f621485b0f103187a64"

      FOX_SYNC_REPO: "https://gitlab.com/OrangeFox/sync.git"
      FOX_SYNC_COMMIT: "14eca5f7ef82c9dacfe353db8b93329383c7293f"

    steps:
      - name: Cleanup GitHub runner
        uses: rokibhasansagar/slimhub_actions@main

      - name: Initialize workspace
        id: work
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/workspace"
          echo "root=${GITHUB_WORKSPACE}/workspace" >> "$GITHUB_OUTPUT"
          echo "fox=${GITHUB_WORKSPACE}/workspace/fox_14.1" >> "$GITHUB_OUTPUT"

      - name: Prepare build environment
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -yq \
            linux-modules-extra-$(uname -r) \
            git python3 tar aria2 xz-utils
          cd "${{ steps.work.outputs.root }}"
          curl -fsSLO "https://gitlab.com/OrangeFox/misc/scripts/-/raw/master/setup/android_build_env.sh"
          sudo bash android_build_env.sh

      - name: Install OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Sync OrangeFox fox_14.1
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.work.outputs.root }}"
          git clone "${FOX_SYNC_REPO}" sync
          cd sync
          git checkout "${FOX_SYNC_COMMIT}"
          ./orangefox_sync.sh \
            --branch "${MANIFEST_BRANCH}" \
            --path "${{ steps.work.outputs.fox }}"

      - name: Install locked DASH sources
        shell: bash
        run: |
          set -euo pipefail
          FOX="${{ steps.work.outputs.fox }}"
          cd "$FOX"

          rm -rf "${DEVICE_PATH}"
          mkdir -p "$(dirname "${DEVICE_PATH}")"
          git init "${DEVICE_PATH}"
          git -C "${DEVICE_PATH}" remote add origin "${DEVICE_TREE_URL}"
          git -C "${DEVICE_PATH}" fetch --depth=1 origin "${DEVICE_TREE_COMMIT}"
          git -C "${DEVICE_PATH}" checkout --detach FETCH_HEAD
          test "$(git -C "${DEVICE_PATH}" rev-parse HEAD)" = "${DEVICE_TREE_COMMIT}"

          clone_locked() {
            repo="$1"
            commit="$2"
            path="$3"
            rm -rf "$path"
            mkdir -p "$(dirname "$path")"
            git init "$path"
            git -C "$path" remote add origin "$repo"
            git -C "$path" fetch --depth=1 origin "$commit"
            git -C "$path" checkout --detach FETCH_HEAD
            test "$(git -C "$path" rev-parse HEAD)" = "$commit"
          }

          clone_locked "${KERNEL_REPO}" "${KERNEL_COMMIT}" "device/xiaomi/dash-kernel"
          clone_locked "${MTK_HW_REPO}" "${MTK_HW_COMMIT}" "hardware/mediatek"
          clone_locked "${MTK_SEPOLICY_REPO}" "${MTK_SEPOLICY_COMMIT}" "device/mediatek/sepolicy_vndr"
          clone_locked "${LINEAGE_SEPOLICY_REPO}" "${LINEAGE_SEPOLICY_COMMIT}" "device/lineage/sepolicy"
          clone_locked "${GOOGLE_INTERFACES_REPO}" "${GOOGLE_INTERFACES_COMMIT}" "hardware/google/interfaces"
          clone_locked "${GOOGLE_PIXEL_REPO}" "${GOOGLE_PIXEL_COMMIT}" "hardware/google/pixel"
          clone_locked "${GUAVA_REPO}" "${GUAVA_COMMIT}" "external/guava"

          cat > "${GITHUB_WORKSPACE}/DASH-SOURCE-LOCK-14R.txt" <<EOF
          OrangeFox branch: ${MANIFEST_BRANCH}
          OrangeFox sync: ${FOX_SYNC_COMMIT}
          DASH tree: ${DEVICE_TREE_COMMIT}
          DASH kernel: ${KERNEL_COMMIT}
          MediaTek hardware: ${MTK_HW_COMMIT}
          MediaTek sepolicy_vndr: ${MTK_SEPOLICY_COMMIT}
          Lineage sepolicy: ${LINEAGE_SEPOLICY_COMMIT}
          Google interfaces: ${GOOGLE_INTERFACES_COMMIT}
          Google Pixel: ${GOOGLE_PIXEL_COMMIT}
          Guava: ${GUAVA_COMMIT}
          EOF

      - name: Verify native DASH source
        shell: bash
        run: |
          set -euo pipefail
          FOX="${{ steps.work.outputs.fox }}"
          cd "$FOX"

          python3 device/xiaomi/dash/tools/preflight-dash-tree.py

          test "$(git -C device/xiaomi/dash rev-parse HEAD)" = "${DEVICE_TREE_COMMIT}"
          test "$(git -C hardware/mediatek rev-parse HEAD)" = "${MTK_HW_COMMIT}"
          test "$(git -C device/mediatek/sepolicy_vndr rev-parse HEAD)" = "${MTK_SEPOLICY_COMMIT}"

          echo "DASH native source verification PASS"

      - name: Set 30 GB swap
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761
        with:
          swap-size-gb: 30

      - name: Show resources before build
        shell: bash
        run: |
          echo "=== CPU ==="
          nproc
          echo "=== MEMORY ==="
          free -h
          echo "=== DISK ==="
          df -h

      - name: Build OrangeFox DASH
        shell: bash
        run: |
          # Android build/envsetup.sh expects some variables to be unset initially.
          # Do not use bash nounset (-u) while sourcing the Android build environment.
          set -eo pipefail
          cd "${{ steps.work.outputs.fox }}"

          source build/envsetup.sh
          lunch "${LUNCH_TARGET}"

          export ALLOW_MISSING_DEPENDENCIES=true
          m vendorbootimage -j"$(nproc --all)" 2>&1 | tee "${GITHUB_WORKSPACE}/dash-build.log"

          test -f out/target/product/dash/vendor_boot.img
          test "$(stat -c %s out/target/product/dash/vendor_boot.img)" = "67108864"

      - name: Collect first-build outputs
        if: always()
        shell: bash
        run: |
          set +e
          OUT="${{ steps.work.outputs.fox }}/out/target/product/dash"
          DEST="${GITHUB_WORKSPACE}/DASH-14S-OUTPUT"
          mkdir -p "$DEST"

          cp -f "${GITHUB_WORKSPACE}/DASH-SOURCE-LOCK-14R.txt" "$DEST/" 2>/dev/null || true
          cp -f "${GITHUB_WORKSPACE}/dash-build.log" "$DEST/" 2>/dev/null || true

          if [ -d "$OUT" ]; then
            find "$OUT" -maxdepth 2 -type f \
              \( -name 'OrangeFox-R*.zip' \
                 -o -name 'OrangeFox-R*.img' \
                 -o -name 'vendor_ramdisk_recovery.cpio' \
                 -o -name 'recovery.img' \
                 -o -name 'vendor_boot.img' \) \
              -exec cp -f {} "$DEST/" \;

            {
              echo "=== OUT FILES ==="
              find "$OUT" -maxdepth 2 -type f -printf '%p %s bytes\n' | sort
              echo
              echo "=== SHA256 COLLECTED ==="
              cd "$DEST"
              sha256sum * 2>/dev/null || true
            } > "$DEST/output-inventory.txt"
          fi

          echo "=== POST-BUILD RESOURCES ===" >> "$DEST/output-inventory.txt"
          free -h >> "$DEST/output-inventory.txt" 2>&1
          df -h >> "$DEST/output-inventory.txt" 2>&1

      - name: Upload DASH first-build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DASH-OrangeFox-14S-${{ github.run_id }}
          path: DASH-14S-OUTPUT/
          if-no-files-found: warn
          retention-days: 7
